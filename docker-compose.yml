services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-roombooking}
    ports:
      - "5432:5432"
    volumes:
      - ./migrations/docker-entrypoint:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d roombooking"]
      interval: 3s
      timeout: 5s
      retries: 10

  app:
    build: .
    expose:
      - "8080"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-roombooking}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      JWT_TTL_HOURS: ${JWT_TTL_HOURS:-24}
      CONFERENCE_SERVICE_TIMEOUT_MS: ${CONFERENCE_SERVICE_TIMEOUT_MS:-3000}
      MOCK_CONFERENCE_FAIL: ${MOCK_CONFERENCE_FAIL:-0}
      MOCK_CONFERENCE_DELAY_MS: ${MOCK_CONFERENCE_DELAY_MS:-0}
      MOCK_CONFERENCE_BAD_LINK: ${MOCK_CONFERENCE_BAD_LINK:-}
    depends_on:
      postgres:
        condition: service_healthy

  slotworker:
    build:
      context: .
      target: slotworker
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-roombooking}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  # Наполнение БД (scripts/seed.py). Запуск: docker compose --profile seed run --rm seed
  seed:
    profiles: [seed]
    image: python:3.12-slim-bookworm
    volumes:
      - ./scripts:/scripts:ro
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-roombooking}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "pip install -q -r /scripts/requirements-seed.txt && python /scripts/seed.py"

  unit-tests:
    profiles: [test]
    build:
      context: .
      target: unit-test

  integration-tests:
    profiles: [test]
    build:
      context: .
      target: integration-test
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-roombooking}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  swagger-ui:
    image: swaggerapi/swagger-ui:v5.32.1
    expose:
      - "8080"
    volumes:
      - ./api.yaml:/usr/share/nginx/html/openapi.yaml:ro
    environment:
      URL: /openapi.yaml

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./docker/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
      - swagger-ui

volumes:
  pgdata:
